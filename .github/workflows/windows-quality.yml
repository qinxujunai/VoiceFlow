name: Windows quality

env:
  PYTHONUTF8: "1"

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 0"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Restore model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            models/sensevoice
            models/streaming-preview
          key: voiceflow-runtime-models-${{ hashFiles('model-manifest.json') }}
      - name: Download and verify pinned runtime models
        run: |
          python scripts/download_models.py --engine sensevoice
          python scripts/download_models.py --engine streaming-preview
      - name: Unit and contract tests
        run: python -m pytest tests -q
      - name: Lifecycle stability gate
        run: python scripts/stability_gate.py --cycles 500
      - name: Runtime doctor
        run: python scripts/doctor.py
      - name: ASR integration smoke
        run: python test_integration.py

  package-smoke:
    needs: test
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Restore model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            models/sensevoice
            models/streaming-preview
          key: voiceflow-runtime-models-${{ hashFiles('model-manifest.json') }}
      - name: Download and verify pinned runtime models
        run: |
          python scripts/download_models.py --engine sensevoice
          python scripts/download_models.py --engine streaming-preview
      - name: Build onedir application
        run: python -m PyInstaller VoiceFlow.spec --noconfirm
      - name: Smoke packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist\VoiceFlow\VoiceFlow.exe)) { throw "VoiceFlow.exe missing" }
          Get-AuthenticodeSignature dist\VoiceFlow\VoiceFlow.exe | Format-List
          ./scripts/smoke_packaged_runtime.ps1
      - name: Build unsigned installer smoke artifact
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DINCLUDE_SENSEVOICE=1 /DINCLUDE_STREAMING_PREVIEW=1 installer\VoiceFlow.iss
      - name: Smoke full offline installer
        shell: pwsh
        run: ./scripts/smoke_installer.ps1 -RequireStreamingPreview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VoiceFlow-windows-unsigned
          path: dist/installer/*.exe

  scheduled-model-smoke:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: models
          key: model-lab-${{ hashFiles('model-manifest.json') }}
      - run: python scripts/download_models.py --all
      - run: python scripts/benchmark_models.py --limit 5 --strict-output | Tee-Object -FilePath model-smoke.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: weekly-model-smoke
          path: model-smoke.txt
