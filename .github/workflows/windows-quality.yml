name: Windows quality

env:
  PYTHONUTF8: "1"

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 0"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: models/sensevoice
          key: sensevoice-${{ hashFiles('model-manifest.json') }}
      - name: Download and verify pinned baseline model
        run: python scripts/download_models.py --engine sensevoice
      - name: Unit and contract tests
        run: python -m pytest tests -q
      - name: Lifecycle stability gate
        run: python scripts/stability_gate.py --cycles 500
      - name: Runtime doctor
        run: python scripts/doctor.py
      - name: ASR integration smoke
        run: python test_integration.py

  package-smoke:
    needs: test
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Build onedir application
        run: python -m PyInstaller VoiceFlow.spec --noconfirm
      - name: Smoke packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist\VoiceFlow\VoiceFlow.exe)) { throw "VoiceFlow.exe missing" }
          Get-AuthenticodeSignature dist\VoiceFlow\VoiceFlow.exe | Format-List
      - name: Build unsigned installer smoke artifact
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer\VoiceFlow.iss
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceFlow-windows-unsigned
          path: dist/installer/*.exe

  scheduled-model-smoke:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - uses: actions/cache@v4
        with:
          path: models
          key: model-lab-${{ hashFiles('model-manifest.json') }}
      - run: python scripts/download_models.py --all
      - run: python scripts/benchmark_models.py --limit 5 | Tee-Object -FilePath model-smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-model-smoke
          path: model-smoke.txt
