<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<style>
:root {
    --bg: rgba(24, 24, 26, 0.88);
    --line: rgba(255, 255, 255, 0.09);
    --text: #f5f5f7;
    --muted: rgba(245, 245, 247, 0.54);
    --red: #ff453a;
    --blue: #64a7ff;
    --gold: #ffb340;
    --green: #32d74b;
    --target-width: 92px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
}

.pill {
    width: var(--target-width);
    height: 34px;
    max-width: 312px;
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-radius: 17px;
    background: var(--bg);
    border: 0.5px solid var(--line);
    box-shadow:
        0 0 0 0.5px rgba(0, 0, 0, 0.10),
        0 1px 3px rgba(0, 0, 0, 0.12),
        0 3px 8px rgba(0, 0, 0, 0.07),
        inset 0 0.5px 0 rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    transform-origin: center center;
    transition:
        width 180ms cubic-bezier(0.2, 0, 0, 1),
        border-color 140ms ease,
        opacity 120ms ease;
}

.pill.no-width-transition {
    transition:
        border-color 140ms ease,
        opacity 120ms ease;
}

.pill.no-transition {
    transition: none !important;
}

.pill.idle {
    --target-width: 86px;
    opacity: 0;
}

.pill.listening {
    --target-width: 86px;
    border-color: rgba(255, 69, 58, 0.18);
}

.pill.streaming {
    border-color: rgba(255, 69, 58, 0.16);
}

.pill.processing,
.pill.finalizing {
    border-color: rgba(100, 167, 255, 0.18);
}

.pill.done,
.pill.final_ready {
    --target-width: 112px;
    border-color: rgba(50, 215, 75, 0.22);
}

.pill.error {
    --target-width: 210px;
    border-color: rgba(255, 179, 64, 0.22);
}

.pill.success {
    animation: confirm 260ms cubic-bezier(0.34, 1.56, 0.64, 1);
    border-color: rgba(50, 215, 75, 0.22);
}

.pill.canceled {
    --target-width: 100px;
}

.mark {
    position: relative;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
}

.mark span {
    width: 2px;
    height: 7px;
    border-radius: 2px;
    background: var(--muted);
    transform: scaleY(var(--level, 0.45));
    transition: transform 90ms linear, background 120ms ease, opacity 120ms ease;
    transform-origin: center;
}

.mark span:nth-child(2) { height: 12px; }
.mark span:nth-child(3) { height: 8px; }

.listening .mark span:nth-child(1),
.streaming .mark span:nth-child(1) {
    background: var(--red);
}
.listening .mark span:nth-child(2),
.streaming .mark span:nth-child(2) {
    background: var(--red);
}
.listening .mark span:nth-child(3),
.streaming .mark span:nth-child(3) {
    background: var(--red);
}

.processing .mark span,
.finalizing .mark span,
.done .mark span,
.final_ready .mark span {
    opacity: 0;
    animation: none;
}

.processing .mark::before,
.finalizing .mark::before {
    content: "";
    position: absolute;
    inset: 2.5px;
    border: 1.6px solid rgba(245, 245, 247, 0.22);
    border-top-color: rgba(245, 245, 247, 0.92);
    border-radius: 50%;
    animation: spin 780ms linear infinite;
}

.done .mark::before,
.final_ready .mark::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 2px;
    width: 6px;
    height: 10px;
    border-right: 1.8px solid var(--green);
    border-bottom: 1.8px solid var(--green);
    border-radius: 1px;
    transform: rotate(42deg);
}

.error .mark span { background: var(--gold); }
.canceled .mark span { background: var(--muted); }

.ticker {
    overflow: hidden;
    min-width: 0;
    color: var(--text);
    font-size: 13px;
    font-weight: 470;
    line-height: 1;
    white-space: nowrap;
    text-align: center;
}

.ticker-text {
    display: block;
    overflow: hidden;
    text-overflow: clip;
}

.listening .ticker,
.idle .ticker {
    color: transparent;
}

.done .ticker,
.final_ready .ticker,
.canceled .ticker {
    color: var(--muted);
}

.processing .ticker,
.finalizing .ticker {
    color: var(--text);
}

.error .ticker {
    color: var(--text);
}

@keyframes confirm {
    0% { transform: scale(1); }
    35% { transform: scale(1.028); }
    100% { transform: scale(1); }
}

@keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.38; }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
    }
}

</style>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
<div id="pill" class="pill idle" role="status" aria-live="polite" aria-atomic="true">
    <div class="mark" aria-hidden="true">
        <span></span><span></span><span></span>
    </div>
    <div id="ticker" class="ticker">
        <span id="txt" class="ticker-text"></span>
    </div>
</div>

<script>
const pill = document.getElementById('pill');
const ticker = document.getElementById('ticker');
const txt = document.getElementById('txt');
let nativeBridge = null;
if (window.qt && window.qt.webChannelTransport && window.QWebChannel) {
    new QWebChannel(window.qt.webChannelTransport, channel => {
        nativeBridge = channel.objects.voiceflowBridge;
    });
}

const MIN_WIDTH = 86;
const MAX_WIDTH = 312;
const STREAM_VISIBLE_GRAPHEMES = 20;
const STREAM_BASE_WIDTH = 96;
const STREAM_GROWTH_PER_GRAPHEME = 10;
const STREAM_APPEND_INTERVAL_MS = 80;
let activeSession = 0;
let streamingQueue = [];
let visibleStreamingText = [];
let streamingAppendTimer = 0;
let streamingCharacterCount = 0;
let streamingTargetWidth = MIN_WIDTH;
let previewPaintReportedSession = -1;

function meterScale(level) {
    return clamp(0.36 + Math.sqrt(clamp(level, 0, 0.16) / 0.16) * 0.92, 0.36, 1.28);
}

function resetAudioLevel() {
    pill.style.setProperty('--level-1', '0.45');
    pill.style.setProperty('--level-2', '0.45');
    pill.style.setProperty('--level-3', '0.45');
    const bars = pill.querySelectorAll('.mark span');
    bars.forEach((bar, index) => bar.style.setProperty('--level', `var(--level-${index + 1})`));
}

function updateAudioLevel(levels, sessionId) {
    if (sessionId !== activeSession) return;
    if (!pill.classList.contains('listening') && !pill.classList.contains('streaming')) return;
    const values = Array.isArray(levels) ? levels.slice(0, 3) : [];
    while (values.length < 3) values.push(0);
    values.forEach((level, index) => {
        pill.style.setProperty(`--level-${index + 1}`, meterScale(Number(level) || 0).toFixed(3));
    });
}

function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
}

function measureTextWidth(text) {
    var w = 0;
    for (var i = 0; i < text.length; i++) {
        var c = text.charCodeAt(i);
        if ((c >= 0x4e00 && c <= 0x9fff) || (c >= 0x3400 && c <= 0x4dbf) ||
            (c >= 0x3000 && c <= 0x303f) || (c >= 0xff00 && c <= 0xffef) ||
            (c >= 0x2e80 && c <= 0x2eff) || (c >= 0x3300 && c <= 0x33bf) ||
            (c >= 0xfe30 && c <= 0xfe4f) || (c >= 0xf900 && c <= 0xfaff)) {
            w += 12;
        } else if (c <= 0x7f) {
            w += 6.8;
        } else {
            w += 8;
        }
    }
    return w;
}

function setWidthForLabel(text) {
    txt.textContent = text || '';
    var width = text ? clamp(50 + measureTextWidth(text) + 36, MIN_WIDTH, MAX_WIDTH) : MIN_WIDTH;
    pill.style.setProperty('--target-width', width + 'px');
    return width;
}

function splitGraphemes(value) {
    if (window.Intl && Intl.Segmenter) {
        const segmenter = new Intl.Segmenter('zh', {granularity: 'grapheme'});
        return Array.from(segmenter.segment(value), item => item.segment);
    }
    return Array.from(value);
}

function renderStreamingTail() {
    txt.textContent = visibleStreamingText.join('');
}

function trimVisibleStreamingText() {
    if (visibleStreamingText.length > STREAM_VISIBLE_GRAPHEMES) {
        visibleStreamingText.splice(
            0,
            visibleStreamingText.length - STREAM_VISIBLE_GRAPHEMES
        );
    }
}

function growStreamingWidth(addedCount) {
    streamingCharacterCount += Math.max(0, Number(addedCount) || 0);
    const target = clamp(
        STREAM_BASE_WIDTH + streamingCharacterCount * STREAM_GROWTH_PER_GRAPHEME,
        MIN_WIDTH,
        MAX_WIDTH
    );
    streamingTargetWidth = Math.max(streamingTargetWidth, target);
    pill.style.setProperty('--target-width', streamingTargetWidth + 'px');
}

function drainStreamingQueue() {
    streamingAppendTimer = 0;
    if (!streamingQueue.length) return;
    visibleStreamingText.push(streamingQueue.shift());
    trimVisibleStreamingText();
    renderStreamingTail();
    growStreamingWidth(1);
    const paintedSession = activeSession;
    if (previewPaintReportedSession !== paintedSession) {
        previewPaintReportedSession = paintedSession;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                if (nativeBridge && activeSession === paintedSession) {
                    nativeBridge.previewPainted(paintedSession);
                }
            });
        });
    }
    if (streamingQueue.length) {
        streamingAppendTimer = setTimeout(drainStreamingQueue, STREAM_APPEND_INTERVAL_MS);
    }
}

function cancelStreamingQueue() {
    clearTimeout(streamingAppendTimer);
    streamingAppendTimer = 0;
    streamingQueue = [];
}

function resetTextMotion() {
    cancelStreamingQueue();
    visibleStreamingText = [];
    streamingCharacterCount = 0;
    streamingTargetWidth = MIN_WIDTH;
    resetAudioLevel();
}

function resetHidden() {
    var keepNoTransition = pill.classList.contains('no-transition');
    var keepNoWidthTransition = pill.classList.contains('no-width-transition');
    resetTextMotion();
    txt.textContent = '';
    pill.style.setProperty('--target-width', MIN_WIDTH + 'px');
    pill.style.width = '';
    var classes = ['pill', 'idle'];
    if (keepNoTransition) classes.push('no-transition');
    if (keepNoWidthTransition) classes.push('no-width-transition');
    pill.className = classes.join(' ');
}

function resetHiddenInstant() {
    pill.classList.add('no-transition');
    resetHidden();
    void pill.offsetWidth;
}

function prepareRecording(sessionId) {
    activeSession = sessionId;
    pill.classList.add('no-width-transition');
    resetHidden();
    pill.style.setProperty('--target-width', MIN_WIDTH + 'px');
    pill.className = 'pill listening no-width-transition';
    requestAnimationFrame(() => pill.classList.remove('no-width-transition'));
}

function showState(state, label) {
    activeSession += 1;
    resetTextMotion();
    pill.className = 'pill ' + state;
    pill.style.width = '';
    setWidthForLabel(label || '');
}

function showRecording(sessionId) {
    prepareRecording(sessionId);
}

function appendStreaming(delta, sessionId) {
    if (!delta) return;
    if (sessionId !== activeSession) return;
    pill.className = 'pill streaming';
    const additions = splitGraphemes(delta);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        visibleStreamingText.push(...additions);
        trimVisibleStreamingText();
        renderStreamingTail();
        growStreamingWidth(additions.length);
        return;
    }
    streamingQueue.push(...additions);
    if (!streamingAppendTimer) {
        drainStreamingQueue();
    }
}

function showProcessing() {
    cancelStreamingQueue();
    activeSession += 1;
    pill.className = 'pill processing';
    setWidthForLabel('处理中');
}

function showFinalizing(sessionId) {
    if (sessionId < activeSession) return;
    cancelStreamingQueue();
    activeSession = sessionId;
    pill.className = 'pill finalizing';
    setWidthForLabel('整理中');
}

function showDone() {
    showState('done', '已完成');
}

function showFinalSummary(characterCount, sessionId) {
    if (sessionId < activeSession) return;
    activeSession = sessionId;
    resetTextMotion();
    pill.className = 'pill final_ready success';
    const count = Math.max(0, Number(characterCount) || 0);
    setWidthForLabel(`已复制 · ${count}字`);
}

function showResult(msg) {
    activeSession += 1;
    resetTextMotion();
    pill.className = 'pill success';
    setWidthForLabel(msg || '');
}

function showError(message) {
    showState('error', message || '出错了');
}

function getStreamingDebugState() {
    return {
        activeSession,
        queueLength: streamingQueue.length,
        visibleText: visibleStreamingText.join(''),
        horizontalOffset: 0,
        expanded: streamingCharacterCount > 0,
        characterCount: streamingCharacterCount,
        targetWidth: streamingTargetWidth
    };
}
</script>
</body>
</html>
