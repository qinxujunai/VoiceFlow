<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<style>
:root {
    --bg: rgba(24, 24, 26, 0.88);
    --line: rgba(255, 255, 255, 0.09);
    --text: #f5f5f7;
    --muted: rgba(245, 245, 247, 0.54);
    --red: #ff453a;
    --blue: #64a7ff;
    --gold: #ffb340;
    --green: #32d74b;
    --target-width: 92px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
}

.pill {
    width: var(--target-width);
    height: 34px;
    max-width: 312px;
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-radius: 17px;
    background: var(--bg);
    border: 0.5px solid var(--line);
    box-shadow:
        0 0 0 0.5px rgba(0, 0, 0, 0.10),
        0 1px 3px rgba(0, 0, 0, 0.12),
        0 3px 8px rgba(0, 0, 0, 0.07),
        inset 0 0.5px 0 rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    transform-origin: center center;
    transition:
        width 180ms cubic-bezier(0.2, 0, 0, 1),
        border-color 140ms ease,
        opacity 120ms ease;
}

.pill.no-width-transition {
    transition:
        border-color 140ms ease,
        opacity 120ms ease;
}

.pill.no-transition {
    transition: none !important;
}

.pill.idle {
    --target-width: 86px;
    opacity: 0;
}

.pill.listening {
    --target-width: 86px;
    border-color: rgba(255, 69, 58, 0.18);
}

.pill.streaming {
    border-color: rgba(255, 69, 58, 0.16);
}

.pill.processing,
.pill.settling {
    border-color: rgba(100, 167, 255, 0.18);
}

.pill.done,
.pill.final_ready {
    --target-width: 112px;
    border-color: rgba(50, 215, 75, 0.22);
}

.pill.error {
    --target-width: 210px;
    border-color: rgba(255, 179, 64, 0.22);
}

.pill.success {
    animation: confirm 160ms cubic-bezier(0.2, 0, 0, 1);
    border-color: rgba(50, 215, 75, 0.22);
}

.pill.canceled {
    --target-width: 100px;
}

.mark {
    position: relative;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
}

.mark span {
    width: 2px;
    height: 7px;
    border-radius: 2px;
    background: var(--muted);
    transform: scaleY(var(--level, 0.45));
    transition: transform 90ms linear, background 120ms ease, opacity 120ms ease;
    transform-origin: center;
}

.mark span:nth-child(2) { height: 12px; }
.mark span:nth-child(3) { height: 8px; }

.listening .mark span:nth-child(1),
.streaming .mark span:nth-child(1) {
    background: var(--red);
}
.listening .mark span:nth-child(2),
.streaming .mark span:nth-child(2) {
    background: var(--red);
}
.listening .mark span:nth-child(3),
.streaming .mark span:nth-child(3) {
    background: var(--red);
}

.processing .mark span,
.settling .mark span,
.final_text .mark span,
.done .mark span,
.final_ready .mark span {
    opacity: 0;
    animation: none;
}

.processing .mark::before,
.settling .mark::before {
    content: "";
    position: absolute;
    inset: 2.5px;
    border: 1.6px solid rgba(245, 245, 247, 0.22);
    border-top-color: rgba(245, 245, 247, 0.92);
    border-radius: 50%;
    animation: spin 780ms linear infinite;
}

.done .mark::before,
.final_ready .mark::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 2px;
    width: 6px;
    height: 10px;
    border-right: 1.8px solid var(--green);
    border-bottom: 1.8px solid var(--green);
    border-radius: 1px;
    transform: rotate(42deg);
}

.error .mark span { background: var(--gold); }
.canceled .mark span { background: var(--muted); }

.ticker {
    overflow: hidden;
    min-width: 0;
    color: var(--text);
    font-size: 13px;
    font-weight: 470;
    line-height: 1;
    white-space: nowrap;
    text-align: center;
}

.ticker-text {
    display: block;
    overflow: hidden;
    text-overflow: clip;
}

.listening .ticker,
.idle .ticker {
    color: transparent;
}

.done .ticker,
.final_ready .ticker {
    color: var(--text);
}

.ticker-authoritative,
.ticker-draft {
    display: inline;
}

.ticker-authoritative {
    color: var(--text);
}

.ticker-draft {
    color: var(--text);
}

.pill.recovery {
    background: rgba(72, 52, 20, 0.96);
    border-color: rgba(245, 183, 72, 0.34);
    color: #ffd58a;
}

.recovery .mark span {
    opacity: 0;
}

.recovery .mark::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
}

.recovery .ticker-authoritative {
    color: #ffd58a;
}

.canceled .ticker { color: var(--muted); }

.processing .ticker {
    color: var(--text);
}

.settling .ticker {
    color: var(--muted);
}

.error .ticker {
    color: var(--text);
}

@keyframes confirm {
    0% { transform: scale(1); }
    45% { transform: scale(1.012); }
    100% { transform: scale(1); }
}

@keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.38; }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
        scroll-behavior: auto !important;
    }
}

</style>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
<div id="pill" class="pill idle" role="status" aria-live="polite" aria-atomic="true">
    <div class="mark" aria-hidden="true">
        <span></span><span></span><span></span>
    </div>
    <div id="ticker" class="ticker">
        <span id="txt" class="ticker-text">
            <span id="authoritativeText" class="ticker-authoritative"></span><span id="draftText" class="ticker-draft"></span>
        </span>
    </div>
</div>

<script>
const pill = document.getElementById('pill');
const ticker = document.getElementById('ticker');
const txt = document.getElementById('txt');
const authoritativeText = document.getElementById('authoritativeText');
const draftText = document.getElementById('draftText');
let nativeBridge = null;
if (window.qt && window.qt.webChannelTransport && window.QWebChannel) {
    new QWebChannel(window.qt.webChannelTransport, channel => {
        nativeBridge = channel.objects.voiceflowBridge;
    });
}

const MIN_WIDTH = 86;
const MAX_WIDTH = 312;
const STREAM_VISIBLE_BUFFER_LIMIT = 64;
const STREAM_QUEUE_LIMIT = 256;
const STREAM_CATCH_UP_GRAPHEMES = 20;
const STREAM_BASE_WIDTH = 96;
const STREAM_CHROME_WIDTH = 50;
const STREAM_TEXT_BREATHING_ROOM = 12;
const STREAM_BASE_INTERVAL_MS = 48;
const STREAM_MIN_INTERVAL_MS = 17;
const STREAM_TARGET_LAG_MS = 180;
const STREAM_HARD_LAG_MS = 600;
const FINAL_REPLACEMENT_DWELL_MS = 140;
let activeSession = 0;
const streamingConfirmedQueue = [];
const streamingVisibleTail = [];
let streamingAppendTimer = 0;
let deliveryStateTimer = 0;
let streamingCharacterCount = 0;
let streamingTargetWidth = MIN_WIDTH;
let streamingAuthoritativeCount = 0;
let previewPaintReportedSession = -1;

function meterScale(level) {
    return clamp(0.36 + Math.sqrt(clamp(level, 0, 0.16) / 0.16) * 0.92, 0.36, 1.28);
}

function resetAudioLevel() {
    pill.style.setProperty('--level-1', '0.45');
    pill.style.setProperty('--level-2', '0.45');
    pill.style.setProperty('--level-3', '0.45');
    const bars = pill.querySelectorAll('.mark span');
    bars.forEach((bar, index) => bar.style.setProperty('--level', `var(--level-${index + 1})`));
}

function updateAudioLevel(levels, sessionId) {
    if (sessionId !== activeSession) return;
    if (!pill.classList.contains('listening') && !pill.classList.contains('streaming')) return;
    const values = Array.isArray(levels) ? levels.slice(0, 3) : [];
    while (values.length < 3) values.push(0);
    values.forEach((level, index) => {
        pill.style.setProperty(`--level-${index + 1}`, meterScale(Number(level) || 0).toFixed(3));
    });
}

function clamp(n, min, max) {
    return Math.max(min, Math.min(max, n));
}

const textMeasureCanvas = document.createElement('canvas');
const textMeasureContext = textMeasureCanvas.getContext('2d');

function measureRenderedTextWidth(text) {
    if (!text || !textMeasureContext) return 0;
    const style = window.getComputedStyle(txt);
    textMeasureContext.font = [
        style.fontStyle,
        style.fontWeight,
        style.fontSize,
        style.fontFamily
    ].join(' ');
    return textMeasureContext.measureText(text).width;
}

function setWidthForLabel(text) {
    authoritativeText.textContent = text || '';
    draftText.textContent = '';
    const width = text
        ? clamp(
            STREAM_CHROME_WIDTH
                + STREAM_TEXT_BREATHING_ROOM
                + measureRenderedTextWidth(text),
            MIN_WIDTH,
            MAX_WIDTH
        )
        : MIN_WIDTH;
    pill.style.setProperty('--target-width', width + 'px');
    return width;
}

function splitGraphemes(value) {
    if (window.Intl && Intl.Segmenter) {
        const segmenter = new Intl.Segmenter('zh', {granularity: 'grapheme'});
        return Array.from(segmenter.segment(value), item => item.segment);
    }
    return Array.from(value);
}

function fitStreamingTailToWidth(graphemes, maxTextWidth) {
    let start = graphemes.length;
    while (start > 0) {
        const candidate = graphemes.slice(start - 1).join('');
        if (measureRenderedTextWidth(candidate) > maxTextWidth) break;
        start -= 1;
    }
    return graphemes.slice(start);
}

function renderStreamingTail() {
    const maxTextWidth = Math.max(
        0,
        streamingTargetWidth
            - STREAM_CHROME_WIDTH
            - STREAM_TEXT_BREATHING_ROOM
    );
    const tail = fitStreamingTailToWidth(streamingVisibleTail, maxTextWidth);
    const tailStart = streamingVisibleTail.length - tail.length;
    const authoritativeCount = clamp(
        streamingAuthoritativeCount - tailStart,
        0,
        tail.length
    );
    authoritativeText.textContent = tail.slice(0, authoritativeCount).join('');
    draftText.textContent = tail.slice(authoritativeCount).join('');
}

function growStreamingWidthTo(graphemes) {
    const measuredWidth = measureRenderedTextWidth(graphemes.join(''));
    const target = clamp(
        STREAM_CHROME_WIDTH + STREAM_TEXT_BREATHING_ROOM + measuredWidth,
        STREAM_BASE_WIDTH,
        MAX_WIDTH
    );
    streamingTargetWidth = clamp(
        Math.max(streamingTargetWidth, target),
        MIN_WIDTH,
        MAX_WIDTH
    );
    pill.style.setProperty('--target-width', streamingTargetWidth + 'px');
}

function appendVisibleGraphemes(graphemes) {
    if (!graphemes.length) return;
    streamingVisibleTail.push(...graphemes);
    if (streamingVisibleTail.length > STREAM_VISIBLE_BUFFER_LIMIT) {
        const removed = streamingVisibleTail.length - STREAM_VISIBLE_BUFFER_LIMIT;
        streamingVisibleTail.splice(0, removed);
        streamingAuthoritativeCount = Math.max(
            0,
            streamingAuthoritativeCount - removed
        );
    }
    streamingCharacterCount += graphemes.length;
    growStreamingWidthTo(streamingVisibleTail);
    renderStreamingTail();
}

function coalesceStreamingBacklog(now, forceBounded = false) {
    if (!streamingConfirmedQueue.length) return;
    const oldestAge = now - streamingConfirmedQueue[0].enqueuedAt;
    const mustCatchUp = oldestAge > STREAM_HARD_LAG_MS;
    const mustBound = streamingConfirmedQueue.length > STREAM_QUEUE_LIMIT;
    if (!mustCatchUp && !mustBound && !forceBounded) return;
    const keep = Math.min(STREAM_CATCH_UP_GRAPHEMES, streamingConfirmedQueue.length);
    const skip = streamingConfirmedQueue.length - keep;
    if (skip > 0) {
        const skipped = streamingConfirmedQueue.splice(0, skip);
        appendVisibleGraphemes(skipped.map(item => item.value));
    }
}

function nextStreamingInterval(now) {
    if (!streamingConfirmedQueue.length) return STREAM_BASE_INTERVAL_MS;
    const age = Math.max(0, now - streamingConfirmedQueue[0].enqueuedAt);
    const pressure = clamp(
        Math.max(age / STREAM_TARGET_LAG_MS, streamingConfirmedQueue.length / 12),
        0,
        1
    );
    return Math.round(
        STREAM_BASE_INTERVAL_MS
        - (STREAM_BASE_INTERVAL_MS - STREAM_MIN_INTERVAL_MS) * pressure
    );
}

function drainStreamingQueue() {
    streamingAppendTimer = 0;
    if (!streamingConfirmedQueue.length) return;
    const now = performance.now();
    coalesceStreamingBacklog(now);
    const next = streamingConfirmedQueue.shift();
    if (!next) return;
    appendVisibleGraphemes([next.value]);
    const paintedSession = activeSession;
    if (previewPaintReportedSession !== paintedSession) {
        previewPaintReportedSession = paintedSession;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                if (nativeBridge && activeSession === paintedSession) {
                    nativeBridge.previewPainted(paintedSession);
                }
            });
        });
    }
    if (streamingConfirmedQueue.length) {
        streamingAppendTimer = setTimeout(
            drainStreamingQueue,
            nextStreamingInterval(now)
        );
    }
}

function cancelStreamingQueue() {
    clearTimeout(streamingAppendTimer);
    streamingAppendTimer = 0;
    streamingConfirmedQueue.length = 0;
}

function cancelDeliveryStateTimer() {
    clearTimeout(deliveryStateTimer);
    deliveryStateTimer = 0;
}

function setTranscriptBuffers(authoritativePrefix, draftTail) {
    const authoritative = splitGraphemes(authoritativePrefix || '');
    const draft = splitGraphemes(draftTail || '');
    const combined = authoritative.concat(draft);
    const removed = Math.max(0, combined.length - STREAM_VISIBLE_BUFFER_LIMIT);
    streamingVisibleTail.length = 0;
    streamingVisibleTail.push(...combined.slice(removed));
    streamingAuthoritativeCount = clamp(
        authoritative.length - removed,
        0,
        streamingVisibleTail.length
    );
    streamingCharacterCount = combined.length;
    streamingTargetWidth = MIN_WIDTH;
    growStreamingWidthTo(streamingVisibleTail);
    renderStreamingTail();
}

function resetTextMotion() {
    cancelStreamingQueue();
    cancelDeliveryStateTimer();
    streamingVisibleTail.length = 0;
    streamingCharacterCount = 0;
    streamingTargetWidth = MIN_WIDTH;
    streamingAuthoritativeCount = 0;
    resetAudioLevel();
}

function resetHidden() {
    var keepNoTransition = pill.classList.contains('no-transition');
    var keepNoWidthTransition = pill.classList.contains('no-width-transition');
    resetTextMotion();
    authoritativeText.textContent = '';
    draftText.textContent = '';
    pill.removeAttribute('aria-label');
    pill.style.setProperty('--target-width', MIN_WIDTH + 'px');
    pill.style.width = '';
    var classes = ['pill', 'idle'];
    if (keepNoTransition) classes.push('no-transition');
    if (keepNoWidthTransition) classes.push('no-width-transition');
    pill.className = classes.join(' ');
}

function resetHiddenInstant() {
    pill.classList.add('no-transition');
    resetHidden();
    void pill.offsetWidth;
}

function prepareRecording(sessionId) {
    activeSession = sessionId;
    pill.classList.add('no-width-transition');
    resetHidden();
    pill.style.setProperty('--target-width', MIN_WIDTH + 'px');
    pill.className = 'pill listening no-width-transition';
    requestAnimationFrame(() => pill.classList.remove('no-width-transition'));
}

function showState(state, label) {
    activeSession += 1;
    resetTextMotion();
    pill.className = 'pill ' + state;
    pill.style.width = '';
    setWidthForLabel(label || '');
}

function showRecording(sessionId) {
    prepareRecording(sessionId);
}

function appendStreaming(delta, sessionId) {
    if (!delta || sessionId !== activeSession) return;
    pill.className = 'pill streaming';
    const nextDelta = splitGraphemes(delta);
    const enqueuedAt = performance.now();
    nextDelta.forEach(value => streamingConfirmedQueue.push({value, enqueuedAt}));
    coalesceStreamingBacklog(enqueuedAt, streamingConfirmedQueue.length > STREAM_QUEUE_LIMIT);
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const immediate = streamingConfirmedQueue.splice(0).map(item => item.value);
        appendVisibleGraphemes(immediate);
        return;
    }
    if (!streamingAppendTimer) {
        drainStreamingQueue();
    }
}

function updateTranscriptState(authoritativePrefix, draftTail, sessionId) {
    if (sessionId !== activeSession) return;
    cancelStreamingQueue();
    setTranscriptBuffers(authoritativePrefix, draftTail);
    pill.className = 'pill streaming';
    pill.setAttribute('aria-label', '实时文字');
}

function showAuthoritativeFinal(text, sessionId) {
    if (sessionId < activeSession) return;
    if (
        sessionId === activeSession
        && (
            pill.classList.contains('final_ready')
            || pill.classList.contains('recovery')
        )
    ) return;
    activeSession = sessionId;
    cancelStreamingQueue();
    setTranscriptBuffers(text || '', '');
    pill.className = 'pill final_text';
    pill.setAttribute('aria-label', '最终文字已确认');
}

function showProcessing() {
    cancelStreamingQueue();
    activeSession += 1;
    pill.className = 'pill processing';
    setWidthForLabel('处理中');
}

function showSettling(sessionId) {
    if (sessionId < activeSession) return;
    if (
        pill.classList.contains('final_text')
        || pill.classList.contains('final_ready')
        || pill.classList.contains('recovery')
    ) return;
    cancelStreamingQueue();
    activeSession = sessionId;
    pill.className = 'pill settling';
    pill.setAttribute('aria-label', '正在完成识别');
}

function showDone() {
    showState('done', '已完成');
}

function showDeliveryState(status, sessionId) {
    if (sessionId < activeSession) return;
    activeSession = sessionId;
    const labels = {
        clipboard_verified_paste_dispatched: '已完成',
        clipboard_verified_only: '已复制',
        recovery_saved_clipboard_unavailable: '已保存'
    };
    const accessible = {
        clipboard_verified_paste_dispatched: '文字已复制，粘贴指令已发送',
        clipboard_verified_only: '文字已复制到剪贴板',
        recovery_saved_clipboard_unavailable: '文字已安全保存，剪贴板暂不可用'
    };
    const render = () => {
        if (sessionId !== activeSession) return;
        resetTextMotion();
        const saved = status === 'recovery_saved_clipboard_unavailable';
        pill.className = saved
            ? 'pill recovery'
            : 'pill final_ready success';
        setWidthForLabel(labels[status] ?? '已复制');
        pill.setAttribute('aria-label', accessible[status] || '文字已复制');
    };
    cancelDeliveryStateTimer();
    if (pill.classList.contains('final_text')) {
        deliveryStateTimer = setTimeout(render, FINAL_REPLACEMENT_DWELL_MS);
    } else {
        render();
    }
}

function showResult(msg) {
    activeSession += 1;
    resetTextMotion();
    pill.className = 'pill success';
    setWidthForLabel(msg || '');
}

function showError(message) {
    showState('error', message || '出错了');
}

function showRecoveryAvailable(count) {
    const total = Math.max(1, Number(count) || 1);
    showState('recovery', `${total} 段录音可恢复`);
}

function getStreamingDebugState() {
    return {
        activeSession,
        queueLength: Math.max(
            0,
            streamingConfirmedQueue.length
        ),
        visibleText: streamingVisibleTail.join(''),
        confirmedText: streamingVisibleTail.join('')
            + streamingConfirmedQueue.map(item => item.value).join(''),
        provisionalText: '',
        horizontalOffset: 0,
        expanded: streamingCharacterCount > 0,
        characterCount: streamingCharacterCount,
        targetWidth: streamingTargetWidth,
        renderedText: txt.textContent,
        renderedTextWidth: measureRenderedTextWidth(txt.textContent),
        tickerWidth: ticker.getBoundingClientRect().width
    };
}
</script>
</body>
</html>
