<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">VoiceFlow product demo</title>
  <desc id="desc">VoiceFlow starts as a compact capsule, expands with a red waveform and live text, then resolves into the real green-check final state with muted text.</desc>
  <defs>
    <filter id="pillShadow" x="-30%" y="-140%" width="160%" height="380%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="softPanel" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#111827" flood-opacity="0.07"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      #wave { animation: waveState 6s ease-in-out infinite; }
      #check { animation: checkState 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      #liveText { animation: liveTextState 6s ease-in-out infinite; }
      #finalText { animation: finalTextState 6s ease-in-out infinite; }
      .bar-a { animation: barA 720ms ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .bar-b { animation: barB 880ms ease-in-out infinite 140ms; transform-box: fill-box; transform-origin: center; }
      .bar-c { animation: barC 790ms ease-in-out infinite 260ms; transform-box: fill-box; transform-origin: center; }
      @keyframes waveState {
        0%, 62% { opacity: 1; }
        70%, 100% { opacity: 0; }
      }
      @keyframes checkState {
        0%, 66%, 100% { opacity: 0; }
        72%, 88% { opacity: 1; }
      }
      @keyframes liveTextState {
        0%, 18%, 66%, 100% { opacity: 0; }
        26%, 60% { opacity: 1; }
      }
      @keyframes finalTextState {
        0%, 66%, 100% { opacity: 0; }
        72%, 88% { opacity: 1; }
      }
      @keyframes barA {
        0%, 100% { transform: scaleY(0.55); opacity: 0.55; }
        50% { transform: scaleY(1.22); opacity: 1; }
      }
      @keyframes barB {
        0%, 100% { transform: scaleY(0.60); opacity: 0.50; }
        55% { transform: scaleY(1.15); opacity: 1; }
      }
      @keyframes barC {
        0%, 100% { transform: scaleY(0.50); opacity: 0.60; }
        45% { transform: scaleY(1.28); opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#f5f5f7"/>

  <g class="ui" filter="url(#softPanel)">
    <rect x="176" y="56" width="848" height="300" rx="28" fill="#ffffff"/>
    <rect x="176.5" y="56.5" width="847" height="299" rx="27.5" fill="none" stroke="#e5e7eb"/>
  </g>

  <g class="ui">
    <text x="600" y="120" text-anchor="middle" font-size="38" font-weight="760" letter-spacing="0" fill="#111827">VoiceFlow</text>
    <text x="600" y="154" text-anchor="middle" font-size="16" font-weight="450" letter-spacing="0" fill="#6b7280">把声音收束成文字，把文字送回光标。</text>
  </g>

  <g id="capsule" transform="translate(557 190)" filter="url(#pillShadow)">
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
      values="557 190;557 190;515 190;482 190;482 190;482 190;557 190"
      keyTimes="0;0.12;0.22;0.34;0.72;0.88;1"
      calcMode="spline"
      keySplines=".22 1 .36 1;.22 1 .36 1;.22 1 .36 1;.16 1 .3 1;.16 1 .3 1;.4 0 .2 1"/>

    <rect id="demo-pill" x="0" y="0" width="86" height="34" rx="17" fill="#1c1c1e" stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.5">
      <animate attributeName="width" dur="6s" repeatCount="indefinite"
        values="86;86;170;236;236;236;86"
        keyTimes="0;0.12;0.22;0.34;0.72;0.88;1"
        calcMode="spline"
        keySplines=".22 1 .36 1;.22 1 .36 1;.22 1 .36 1;.16 1 .3 1;.16 1 .3 1;.4 0 .2 1"/>
    </rect>

    <g id="wave" transform="translate(16 8)">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
        values="1;1;1;0;0;1"
        keyTimes="0;0.62;0.70;0.72;0.88;1"/>
      <rect class="bar-a" x="0" y="5.5" width="2" height="7" rx="1" fill="#ff453a"/>
      <rect class="bar-b" x="6" y="3" width="2" height="12" rx="1" fill="#ff453a"/>
      <rect class="bar-c" x="12" y="5" width="2" height="8" rx="1" fill="#ff453a"/>
    </g>

    <g id="check" transform="translate(12 8)" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
        values="0;0;1;1;0"
        keyTimes="0;0.66;0.72;0.88;1"/>
      <path d="M4.5 9.2 L7.5 12.2 L13.5 5.8" fill="none" stroke="#32d74b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text id="liveText" class="ui" x="44" y="22" font-size="13" font-weight="470" letter-spacing="0" fill="#f5f5f7" opacity="0">明早十点，把方案同步给团队。
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
        values="0;0;1;1;0;0"
        keyTimes="0;0.25;0.30;0.62;0.70;1"/>
    </text>
    <text id="finalText" class="ui" x="44" y="22" font-size="13" font-weight="470" letter-spacing="0" fill="#c7c7cc" opacity="0">明早十点，把方案同步给团队。
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
        values="0;0;1;1;0"
        keyTimes="0;0.66;0.72;0.88;1"/>
    </text>
  </g>

  <g class="ui">
    <text x="600" y="276" text-anchor="middle" font-size="14" font-weight="560" letter-spacing="0" fill="#111827">真实胶囊状态：录音预览 → 最终确认 → 剪贴板兜底</text>
    <text x="600" y="304" text-anchor="middle" font-size="13" font-weight="430" letter-spacing="0" fill="#8a8f98">不夸张、不抢屏，只把可靠的文字送到你正在输入的位置。</text>
  </g>
</svg>
