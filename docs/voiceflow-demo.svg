<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">VoiceFlow actual overlay states</title>
  <desc id="desc">A faithful preview of the actual VoiceFlow short dictation overlay: red waveform while recording, complete short text in the pill, then a green checkmark with muted final text.</desc>
  <defs>
    <filter id="pillShadow" x="-30%" y="-130%" width="160%" height="360%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
      #wave { animation: waveState 5.8s ease infinite; }
      #check { animation: checkState 5.8s ease infinite; }
      #liveText { animation: liveTextState 5.8s ease infinite; }
      #finalText { animation: finalTextState 5.8s ease infinite; }
      .bar-a { animation: barA 720ms ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .bar-b { animation: barB 880ms ease-in-out infinite 140ms; transform-box: fill-box; transform-origin: center; }
      .bar-c { animation: barC 790ms ease-in-out infinite 260ms; transform-box: fill-box; transform-origin: center; }
      @keyframes waveState {
        0%, 12%, 68%, 100% { opacity: 0; }
        16%, 64% { opacity: 1; }
      }
      @keyframes checkState {
        0%, 66%, 100% { opacity: 0; }
        72%, 88% { opacity: 1; }
      }
      @keyframes liveTextState {
        0%, 12%, 68%, 100% { opacity: 0; }
        16%, 64% { opacity: 1; }
      }
      @keyframes finalTextState {
        0%, 66%, 100% { opacity: 0; }
        72%, 88% { opacity: 1; }
      }
      @keyframes barA {
        0%, 100% { transform: scaleY(0.55); opacity: 0.55; }
        50% { transform: scaleY(1.22); opacity: 1; }
      }
      @keyframes barB {
        0%, 100% { transform: scaleY(0.60); opacity: 0.50; }
        55% { transform: scaleY(1.15); opacity: 1; }
      }
      @keyframes barC {
        0%, 100% { transform: scaleY(0.50); opacity: 0.60; }
        45% { transform: scaleY(1.28); opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" fill="#f5f5f7"/>
  <g class="ui">
    <text x="600" y="92" text-anchor="middle" font-size="34" font-weight="760" fill="#1d1d1f">VoiceFlow</text>
    <text x="600" y="130" text-anchor="middle" font-size="18" font-weight="430" fill="#6e7480">按下快捷键，说话。最终文本先进入剪贴板，再落到当前光标。</text>
  </g>

  <g transform="translate(444 178)" filter="url(#pillShadow)">
    <rect id="demo-pill" x="0" y="0" width="312" height="34" rx="17" fill="#1c1c1e" stroke="#ffffff" stroke-opacity="0.10" stroke-width="0.5"/>

    <g id="wave" transform="translate(16 8)">
      <rect class="bar-a" x="0" y="5.5" width="2" height="7" rx="1" fill="#ff453a"/>
      <rect class="bar-b" x="6" y="3" width="2" height="12" rx="1" fill="#ff453a"/>
      <rect class="bar-c" x="12" y="5" width="2" height="8" rx="1" fill="#ff453a"/>
    </g>

    <path id="check" d="M17 8.5 l4 5.5 l8 -10" fill="none" stroke="#32d74b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <text id="liveText" class="ui" x="44" y="22" font-size="13" font-weight="470" fill="#f5f5f7">说完，即刻落字。最终文本已复制。</text>
    <text id="finalText" class="ui" x="44" y="22" font-size="13" font-weight="470" fill="#c7c7cc">说完，即刻落字。最终文本已复制。</text>
  </g>

  <g class="ui" transform="translate(310 270)">
    <text x="0" y="0" font-size="15" font-weight="650" fill="#1d1d1f">真实状态</text>
    <text x="0" y="30" font-size="14" fill="#6e7480">录音中：红色波形 + 实时预览</text>
    <text x="0" y="56" font-size="14" fill="#6e7480">停止后：绿色勾 + 最终文本变淡收束</text>

    <text x="430" y="0" font-size="15" font-weight="650" fill="#1d1d1f">可靠输出</text>
    <text x="430" y="30" font-size="14" fill="#6e7480">最终文本先复制到剪贴板</text>
    <text x="430" y="56" font-size="14" fill="#6e7480">即使光标不在输入框，文字也不会丢</text>
  </g>
</svg>
