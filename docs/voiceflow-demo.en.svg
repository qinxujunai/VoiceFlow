<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">VoiceFlow product demo</title>
  <desc id="desc">F2 is held down while a single VoiceFlow capsule fills in with live English text; on release the final sentence replaces the draft in place, returns to the cursor, and the capsule quietly disappears.</desc>
  <defs>
    <filter id="pillShadow" x="-30%" y="-140%" width="160%" height="380%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#000000" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif; }
      #keycap { animation: keyHold 6.8s cubic-bezier(.22,1,.36,1) infinite; }
      #keyFace { animation: keyFace 6.8s linear infinite; }
      #capsule { animation: capsuleState 6.8s cubic-bezier(.22,1,.36,1) infinite; transform-origin: 0 0; }
      #demo-pill { animation: pillState 6.8s cubic-bezier(.22,1,.36,1) infinite; width: 96px; }
      #wave { animation: waveState 6.8s ease-in-out infinite; }
      #liveText { animation: liveTextState 6.8s steps(1) infinite; }
      #liveText tspan { fill-opacity: 0; }
      .c1 { animation: c1 6.8s linear infinite; }
      .c2 { animation: c2 6.8s linear infinite; }
      .c3 { animation: c3 6.8s linear infinite; }
      .c4 { animation: c4 6.8s linear infinite; }
      .c5 { animation: c5 6.8s linear infinite; }
      #finalText { animation: finalTextState 6.8s steps(1) infinite; }
      #outputText, #outputCaret { animation: outputState 6.8s steps(1) infinite; }
      .bar-a { animation: barA 720ms ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .bar-b { animation: barB 880ms ease-in-out infinite 140ms; transform-box: fill-box; transform-origin: center; }
      .bar-c { animation: barC 790ms ease-in-out infinite 260ms; transform-box: fill-box; transform-origin: center; }
      #outputCaret { animation-name: outputState, caretBlink; animation-duration: 6.8s, 900ms; animation-timing-function: ease-in-out, steps(1); animation-iteration-count: infinite, infinite; }
      @keyframes keyHold {
        0%, 11%, 65%, 100% { transform: translateY(0px); }
        13%, 63% { transform: translateY(2px); }
      }
      @keyframes keyFace {
        0%, 11%, 65%, 100% { fill: #ffffff; }
        13%, 63% { fill: #e8e8ed; }
      }
      /* The capsule appears as F2 goes down and is gone after the silent finish: none before the press, none at the loop's end. */
      @keyframes capsuleState {
        0%, 12% { opacity: 0; transform: translate(552px,168px); }
        14% { opacity: 1; }
        22%, 76% { opacity: 1; transform: translate(410px,168px); }
        82%, 100% { opacity: 0; transform: translate(552px,168px); }
      }
      @keyframes pillState {
        0%, 12%, 96%, 100% { width: 96px; }
        22%, 64% { width: 380px; }
        72%, 76% { width: 380px; }
        82%, 100% { width: 96px; }
      }
      @keyframes waveState {
        0%, 64% { opacity: 1; }
        70%, 100% { opacity: 0; }
      }
      @keyframes liveTextState {
        0%, 18%, 68%, 100% { opacity: 0; }
        25%, 64% { opacity: 1; }
      }
      /* Each phrase fades in whole over 136 ms, as new text does in the app. */
      @keyframes c1 { 0%, 26% { fill-opacity: 0; } 28%, 100% { fill-opacity: 1; } }
      @keyframes c2 { 0%, 33% { fill-opacity: 0; } 35%, 100% { fill-opacity: 1; } }
      @keyframes c3 { 0%, 40% { fill-opacity: 0; } 42%, 100% { fill-opacity: 1; } }
      @keyframes c4 { 0%, 47% { fill-opacity: 0; } 49%, 100% { fill-opacity: 1; } }
      @keyframes c5 { 0%, 54% { fill-opacity: 0; } 56%, 100% { fill-opacity: 1; } }
      /* The final sentence takes the draft's place before the draft goes: no empty capsule. */
      @keyframes finalTextState {
        0%, 66%, 82%, 100% { opacity: 0; }
        67%, 76% { opacity: 1; }
      }
      @keyframes deliveryDismissState {
        0%, 76% { opacity: 1; }
        82%, 100% { opacity: 0; }
      }
      @keyframes outputState {
        0%, 68%, 100% { opacity: 0; }
        75%, 88% { opacity: 1; }
      }
      @keyframes caretBlink {
        0%, 48% { opacity: 1; }
        49%, 100% { opacity: 0; }
      }
      @keyframes barA {
        0%, 100% { transform: scaleY(0.55); opacity: 0.55; }
        50% { transform: scaleY(1.22); opacity: 1; }
      }
      @keyframes barB {
        0%, 100% { transform: scaleY(0.60); opacity: 0.50; }
        55% { transform: scaleY(1.15); opacity: 1; }
      }
      @keyframes barC {
        0%, 100% { transform: scaleY(0.50); opacity: 0.60; }
        45% { transform: scaleY(1.28); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #capsule { animation: none; transform: translate(552px, 168px); opacity: 0; }
        #demo-pill { animation: none; width: 96px; }
        #wave, #liveText, #finalText { opacity: 0; }
        #outputText, #outputCaret { opacity: 1; }
        #keycap, #keyFace, #wave, #liveText, #finalText, #outputText, #outputCaret,
        .c1, .c2, .c3, .c4, .c5, .bar-a, .bar-b, .bar-c { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="48" fill="#f5f5f7"/>

  <g class="ui">
    <g id="keycap">
      <rect id="keyFace" x="545" y="72" width="42" height="28" rx="8" fill="#ffffff"/>
      <rect x="545.5" y="72.5" width="41" height="27" rx="7.5" fill="none" stroke="#d2d2d7"/>
      <text x="566" y="91" text-anchor="middle" font-size="12" font-weight="650" fill="#1d1d1f">F2</text>
    </g>
    <text x="600" y="123" text-anchor="middle" font-size="15" font-weight="500" fill="#6e6e73">Hold to speak, release to insert</text>
  </g>

  <g id="capsule" transform="translate(410 168)">
    <rect id="demo-pill" x="0" y="0" width="380" height="52" rx="26" fill="#1c1c1e" filter="url(#pillShadow)"/>

    <g id="wave" transform="translate(22 16)">
      <rect class="bar-a" x="0" y="5.5" width="2.4" height="9" rx="1.2" fill="#ff453a"/>
      <rect class="bar-b" x="7" y="2.5" width="2.4" height="15" rx="1.2" fill="#ff453a"/>
      <rect class="bar-c" x="14" y="5" width="2.4" height="10" rx="1.2" fill="#ff453a"/>
    </g>

    <text id="liveText" class="ui" x="66" y="33" font-size="18" font-weight="500" fill="#f5f5f7" opacity="0"><tspan class="c1">Send</tspan> <tspan class="c2">the</tspan> <tspan class="c3">plan</tspan> <tspan class="c4">by</tspan> <tspan class="c5">ten.</tspan></text>
    <text id="finalText" class="ui" x="66" y="33" font-size="18" font-weight="500" fill="#f5f5f7" opacity="0">Send the plan by ten.</text>
  </g>

  <g class="ui" fill="#1d1d1f">
    <text id="outputText" x="600" y="304" text-anchor="middle" font-size="30" font-weight="620" letter-spacing="-0.6" opacity="0">Send the plan by ten.</text>
    <rect id="outputCaret" x="754" y="278" width="2.5" height="32" rx="1.25" fill="#0071e3" opacity="0"/>
  </g>
</svg>
