# VoiceFlow 默认配置模板
# 首次运行会复制到 %LOCALAPPDATA%\VoiceFlow\config.yaml

# ============================================================
# 引擎配置
# ============================================================
engine:
  # 当前使用的 ASR 引擎
  # 可选: sensevoice / qwen3-asr
  active: "sensevoice"

  # 引擎配置
  sensevoice:
    model_path: "models/sensevoice/model.int8.onnx"
    tokens_path: "models/sensevoice/tokens.txt"
    language: "auto"            # 推荐自动中英；也可在设置中固定 zh / en / yue
    use_itn: true               # 逆文本正则化（数字、日期等标准化）
    provider: "cpu"             # sherpa-onnx provider；默认 CPU 最稳
    num_threads: "auto"         # 按物理核心自动选择，给音频和界面留出余量

  qwen3-asr:
    conv_frontend_path: "models/qwen3-asr/conv_frontend.onnx"
    encoder_path: "models/qwen3-asr/encoder.int8.onnx"
    decoder_path: "models/qwen3-asr/decoder.int8.onnx"
    tokenizer_path: "models/qwen3-asr/tokenizer"
    hotwords: ""                # 可选热词，以空格分隔
    provider: "cpu"
    num_threads: "auto"

  fun-asr-nano:
    encoder_adaptor_path: "models/fun-asr-nano/encoder_adaptor.int8.onnx"
    llm_path: "models/fun-asr-nano/llm.int8.onnx"
    embedding_path: "models/fun-asr-nano/embedding.int8.onnx"
    tokenizer_path: "models/fun-asr-nano/Qwen3-0.6B"
    language: "zh"
    use_itn: true
    hotwords: ""
    provider: "cpu"
    num_threads: "auto"

  whisper-turbo:
    encoder_path: "models/whisper-turbo/turbo-encoder.int8.onnx"
    decoder_path: "models/whisper-turbo/turbo-decoder.int8.onnx"
    tokens_path: "models/whisper-turbo/turbo-tokens.txt"
    language: "zh"
    provider: "cpu"
    num_threads: "auto"

# 胶囊使用独立的小型真流式模型，只负责边说边显示。
# 停止后的最终文本仍由上面的主引擎完整识别。
streaming_preview:
  enabled: true
  runtime_engine: "online-transducer"
  encoder_path: "models/streaming-preview/encoder-epoch-99-avg-1.int8.onnx"
  decoder_path: "models/streaming-preview/decoder-epoch-99-avg-1.onnx"
  joiner_path: "models/streaming-preview/joiner-epoch-99-avg-1.int8.onnx"
  tokens_path: "models/streaming-preview/tokens.txt"
  provider: "cpu"
  num_threads: "auto"
  stability_guard_chars: 0

performance:
  # 默认自动按物理核心分档；manual 仅供维护者做受控基准。
  thread_mode: "auto"

# ============================================================
# 音频配置
# ============================================================
audio:
  sample_rate: 16000            # 采样率（Hz），所有模型都要求 16kHz
  channels: 1                   # 单声道
  dtype: "int16"                # 采样格式
  device_index: null            # 麦克风设备索引，null = 系统默认
  # 如果有多个麦克风，用 scripts/test_mic.py 查看设备列表后填写索引

# ============================================================
# VAD 配置（语音活动检测，用于降噪辅助，不用于断句）
# ============================================================
vad:
  enabled: true
  # VAD 默认只辅助识别静音边界，不自动结束用户的录音。
  auto_stop_on_silence: false
  # 仅在显式开启 auto_stop_on_silence 后使用。
  silence_timeout: 1.5
  # 最少录多久才允许自动停（防止误触立即停）
  min_recording: 1.0
  # 能量阈值：低于此值视为静音（0.0-1.0）
  energy_threshold: 0.02
  # 极低能量快速拒绝门；真正的人声判断由本地 Silero VAD 完成。
  asr_energy_floor: 0.002
  model_path: "assets/silero_vad.onnx"
  speech_probability_threshold: 0.5
  # 至少累计 90ms 人声才调用 ASR，过滤底噪和按键声，不删除单字。
  min_speech_ms: 90

# ============================================================
# 快捷键配置
hotkeys:
  # 录音：F2 或鼠标侧键开始；再次按下停止并粘贴文字
  push_to_talk: ["f2", "xbutton1", "xbutton2", "right_ctrl"]  # F2 / 鼠标侧键 / 右 Control

  # 取消本次录音（不输出文字）
  cancel: "escape"

# ============================================================
# 输出配置
# ============================================================
output:
  # 完整文本先进入剪贴板，再发送 Ctrl+V；不模拟中文逐字键入。
  mode: "clipboard"

  # 不在用户原话后追加隐藏字符；完整终稿逐字符进入剪贴板。
  auto_space: false

  # 是否在输出后自动加句号（Toggle 模式下）
  auto_period: false

  # 兜底机制：粘贴失败时的处理
  fallback:
    # 粘贴失败时自动将文字存入剪贴板
    to_clipboard: true
    # 同时写入本地历史文件（防止剪贴板被覆盖）
    to_history: true

# 本地崩溃恢复：只保留尚未成功交付的临时 PCM。
recovery:
  enabled: true
  retention_hours: 24

# ============================================================
# 热词知识库配置
# ============================================================
hotwords:
  enabled: true
  # 词表文件目录
  directory: "knowledge-base"
  # 要加载的词表文件（按优先级排序）
  files:
    - "builtin-ai.txt"
    - "corrections.txt"
    - "user-dictionary.txt"
    - "phrases.txt"
  # 热词权重（默认 1.0，越大越优先匹配）
  default_weight: 1.0

# ============================================================
# 系统配置
# ============================================================
system:
  # 录音开始提示音（null = 不播放）
  start_sound: null
  # 录音结束提示音
  end_sound: null
  # 是否显示系统托盘图标
  tray_icon: true
  # 日志级别: DEBUG / INFO / WARNING / ERROR
  log_level: "INFO"
  # 日志文件路径（null = 只输出到控制台）
  log_file: "logs/stt.log"

# ============================================================
# 文本清理器（后处理，零延迟）
# ============================================================
cleaner:
  # 中英文之间自动加空格
  auto_space_en: true

  # 常见音近错字修正（从 knowledge-base/ 加载自定义词表）
  fix_mistakes: true

  # 基础标点补充
  basic_punctuation: false
